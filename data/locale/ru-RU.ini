GoogleDisclosure="Подключение открывает браузер и обращается к Google OAuth и YouTube Live API. Читаются только существующие трансляции. Токены шифруются DPAPI и могут обновляться автоматически. Нужен зарегистрированный Desktop client; публичное распространение может требовать проверки Google. Приватный client secret не встроен."
TwitchDisclosure="Подключение открывает Twitch в браузере и обращается к Twitch OAuth и Helix для чтения ключа. Нужен Public client. Токены шифруются DPAPI, автоматически обновляются и проверяются при запуске и каждый час. Отключение удаляет токены; ключ трансляции удаляется отдельно."
