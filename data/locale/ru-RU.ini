LanguageRestart="Выбор языка сохраняется сразу и вступает в силу после перезапуска OBS."
HelpDetails="БЫСТРЫЙ СТАРТ\n• Выберите сервер, вставьте ключ трансляции и нажмите «Сохранить ключ». Перед запуском сохраните настройки.\n• Либо привяжите аккаунт. Зарегистрируйте OAuth-приложение Google типа Desktop (включите YouTube Data API v3) или Twitch типа Public и укажите Client ID в настройке подключения. Кнопка привязки откроет сайт площадки. Для Google в режиме Testing добавьте свой аккаунт в тестовые пользователи.\n• YouTube: создайте трансляцию и привяжите поток в YouTube Studio, загрузите список в настройках и выберите трансляцию. Счётчик, чат и редактор используют именно её. Одного ручного ключа недостаточно для чата и счётчика зрителей.\n\nДОКПАНЕЛИ И АККАУНТЫ\n• В меню OBS «Док-панели» включите StreamBridge — Чат и Данные трансляции. Нажмите «Подключить чат». Действия модератора — по правой кнопке на сообщении. Старые аккаунты переподключите, чтобы выдать новые права.\n• Зрители обновляются примерно раз в минуту. Серый 0 — зрителей нет; серое тире — данные недоступны, скрыты или ещё не загружены.\n• Чат YouTube расходует квоту API. При ошибке квоты или прав проверьте консоль разработчика и нажмите «Обновить». Сообщения Twitch Shared Chat из чужого канала здесь модерировать нельзя.\n• Название и категория публикуются через API; черновик уведомления нужно скопировать в кабинет площадки.\n\nБРАУЗЕР И ПРОКСИ\n• Добавьте «Браузерный источник с прокси» и откройте защищённую настройку URL и прокси. Укажите HTTPS-адрес виджета, выберите SOCKS5 или HTTP CONNECT и проверьте подключение.\n• Каждый браузерный источник использует свой прокси. Трансляции, API аккаунтов и чат этот прокси не используют. Отключайте прокси только для намеренного прямого доступа.\n• В режиме прокси ошибка соединения останавливает загрузку; прямого обхода нет. Проверка внешнего IP обращается к api.ipify.org только по нажатию кнопки.\n\nБЕЗОПАСНОСТЬ И ОБНОВЛЕНИЯ\n• Ключи потоков, OAuth-токены, адреса виджетов и данные прокси зашифрованы DPAPI для вашего аккаунта Windows. Не передавайте их и скриншоты с открытыми ключами другим людям. Отключение аккаунта удаляет локальные токены; сохранённый ключ потока удаляется отдельно.\n• Проверка TLS включена. Не устанавливайте неизвестные сертификаты для доступа к площадкам.\n• Обновления загружаются с GitHub Releases и проверяются. Для предварительных версий включите соответствующую опцию. Нажмите «Установить» и закройте OBS обычным способом; настройки сохранятся.\n• Во вкладке «О плагине» можно выбрать русский или английский язык. Для применения перезапустите OBS."
