HelpDetails="GET STARTED\n• Select a server, paste your stream key and click Save key. Save the settings before streaming.\n• Or connect an account. Register a Google OAuth Desktop application (enable YouTube Data API v3) or a Twitch Public application and enter the Client ID in Account setup. The Connect button opens the platform website. Testing Google apps must allow your account as a test user.\n• YouTube: create and bind a broadcast in YouTube Studio, load the list in Settings and use the selected broadcast. Counters, chat and metadata refer to that selected broadcast. A manually entered key alone cannot provide chat or viewer data.\n\nDOCKS AND ACCOUNTS\n• Enable StreamBridge Chat and Stream information in the OBS Docks menu. Click Connect chat to start receiving messages. Right-click a message for moderation. Reconnect older accounts to grant the new permissions.\n• Viewer counts refresh about once a minute. Grey 0 means no viewers; a grey dash means unavailable, hidden or not yet loaded.\n• YouTube chat uses API quota. If quota or permissions fail, wait/check the developer console and click Refresh. Twitch shared-chat messages from other channels cannot be moderated here.\n• Titles and categories are published by the API; notification drafts must be copied to the platform dashboard.\n\nPROXY BROWSER\n• Add a Proxied Browser Source, then Configure URL and proxy securely. Use your HTTPS widget URL; choose SOCKS5 or HTTP CONNECT and test the connection.\n• Each browser source has its own proxy. Stream outputs, account APIs and chat do not use that proxy. Disable the proxy only when direct access is intended.\n• In proxy mode a connection failure stops loading; there is no direct fallback. External IP checks contact api.ipify.org only when requested.\n\nSECURITY AND UPDATES\n• Stream keys, OAuth tokens and widget/proxy credentials are encrypted for your Windows account with DPAPI. Do not send credentials or unredacted screenshots to anyone. Disconnect removes local account tokens; delete a saved stream key separately.\n• TLS verification remains enabled. Never install unknown certificates to fix platform access.\n• Updates are verified downloads from GitHub Releases. Preview releases require Include preview releases. Click Install and close OBS normally; settings are preserved.\n• Under About you can choose Russian or English. Restart OBS to apply."
