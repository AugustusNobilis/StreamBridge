About="О плагине"
ProxyDetails="Добавьте Proxied Browser Source в списке источников OBS и откройте настройку URL и прокси. У каждого источника свой браузер и прокси. Поддерживаются HTTP CONNECT, HTTPS CONNECT и SOCKS5 TCP с авторизацией. При отказе прокси прямого подключения нет; DNS назначения разрешается удалённо. HTTP и SOCKS5 не шифруют пароль на участке до прокси: используйте доверенную сеть или HTTPS CONNECT."
SecurityDetails="Ключи трансляций, OAuth-токены, URL виджетов и данные прокси шифруются Windows DPAPI для текущего пользователя. Переносимые настройки также привязаны к нему. Диагностика StreamBridge содержит только переходы состояний и безопасные коды ошибок. OBS и сторонние модули ведут собственные журналы. Телеметрии нет."
ExportLogs="Экспорт диагностики StreamBridge"
SaveFailed="Не удалось сохранить файл."
UpdatesDetails="Проверка обновлений будет доступна после настройки публичного репозитория релизов. Фоновых запросов и автоматической установки нет."
AboutDetails="OBS StreamBridge 0.1.2 — этап разработки\nGPL-2.0-or-later. OBS 32+ и Qt6.\nРезультаты проверок и ограничения: README и docs/TEST-RESULTS.md."
