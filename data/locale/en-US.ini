ProxyDetails="Add Proxied Browser Source from the OBS Sources menu, then open Configure URL and proxy securely. Each source has its own browser and proxy. HTTP CONNECT, HTTPS CONNECT and authenticated SOCKS5 TCP are supported. Proxy mode fails closed; destination DNS is resolved remotely. Plain HTTP and SOCKS5 do not encrypt proxy credentials on the connection to the proxy. Use a trusted network or HTTPS CONNECT."
SecurityDetails="Stream keys, OAuth tokens, widget URLs and proxy credentials are encrypted with Windows DPAPI for the current Windows user. Portable settings remain bound to that user. StreamBridge diagnostics contain state transitions and safe error codes only. OBS and third-party modules maintain their own logs. No telemetry."
