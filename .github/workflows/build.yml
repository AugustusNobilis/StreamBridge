name: Windows build and draft release
on:
  push:
    branches: [main, 'fix/installer-lifecycle-ci', 'fix/installer-lifecycle-ci-*']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check formatting
        run: ./tools/format.ps1 -Check
      - name: Fetch verified dependencies and build OBS SDK
        run: ./tools/bootstrap.ps1
      - name: Build plugin and sandboxed helper
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: ./tools/build.ps1 -Repository $env:RELEASE_REPOSITORY
      - name: Run automated tests
        run: |
          $env:PATH = (Resolve-Path '.deps/obs-deps-qt6-2025-08-23-x64/bin').Path + ';' + $env:PATH
          $env:QT_PLUGIN_PATH = (Resolve-Path '.deps/obs-deps-qt6-2025-08-23-x64/plugins').Path
          ctest --test-dir build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tools/prepare-proxy-fixture.ps1
          ./build/Release/proxy-tests.exe .deps/proxy-fixture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package installer and ZIP
        run: ./tools/package.ps1
      - name: Verify package manifests and contents
        run: ./tools/verify-package.ps1
      - name: Test installer and in-place update lifecycle
        timeout-minutes: 15
        run: |
          New-Item -ItemType Directory -Force build/lifecycle-diagnostics | Out-Null
          function Test-Suite([string]$Name, [scriptblock]$Run) {
            $watch = [Diagnostics.Stopwatch]::StartNew()
            $status = 'FAILED'
            Write-Output "SUITE START $Name"
            try { & $Run; $status = 'PASS' }
            finally {
              $line = 'SUITE END {0} status={1} duration={2:F3}s' -f $Name,$status,$watch.Elapsed.TotalSeconds
              $line | Tee-Object -FilePath build/lifecycle-diagnostics/suites.log -Append
            }
          }
          $version = [regex]::Match((Get-Content CMakeLists.txt -Raw), 'project\(obs-streambridge VERSION ([0-9.]+)').Groups[1].Value
          $installer = "dist/obs-streambridge-$version-windows-x64-setup.exe"
          Test-Suite process-containment { ./tools/test-lifecycle-process.ps1 }
          Test-Suite installer-path-safety { ./tools/test-installer-paths.ps1 -IsolatedNormal }
          Test-Suite installer-portable-and-registry { ./tools/test-installer.ps1 -Installer $installer -ObsExecutable build/Release/update-host-fixture.exe }
          Test-Suite published-0.2.5-upgrade { ./tools/test-published-upgrade.ps1 -Installer $installer -ObsExecutable build/Release/update-host-fixture.exe }
          Test-Suite updater-default { ./tools/test-updater.ps1 -Installer $installer }
          Test-Suite updater-immediate-exit { ./tools/test-updater.ps1 -Installer $installer -ImmediateExit }
          Test-Suite updater-restart-before-install { ./tools/test-updater.ps1 -Installer $installer -RestartBeforeInstall }
          Test-Suite updater-auto-restart { ./tools/test-updater.ps1 -Installer $installer -AutoRestart }
          Test-Suite updater-cancel-restart { ./tools/test-updater.ps1 -Installer $installer -CancelRestart }
          Test-Suite updater-reject-restart { ./tools/test-updater.ps1 -Installer $installer -RejectRestart }
      - name: Preserve lifecycle diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lifecycle-diagnostics
          path: |
            .deps/installer-test-*/*.log
            .deps/updater-test-*/*.log
            .deps/updater-test-*/download/*result.ini
            build/lifecycle-diagnostics/**/*.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-x64
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: windows-x64
          path: dist
      - name: Create a draft for maintainer review
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = [regex]::Match((Get-Content CMakeLists.txt -Raw), 'project\(obs-streambridge VERSION ([0-9.]+)').Groups[1].Value
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Tag and binary version differ' }
          # Never overwrite an already published/verified release.
          gh release view $env:RELEASE_TAG --repo $env:RELEASE_REPOSITORY --json tagName *> $null
          if ($LASTEXITCODE -eq 0) { Write-Output 'Release already exists; assets were left unchanged.'; exit 0 }
          $assets = (Get-ChildItem dist -File).FullName
          gh release create $env:RELEASE_TAG @assets --repo $env:RELEASE_REPOSITORY --verify-tag --draft --prerelease --title "StreamBridge $version" --notes-file docs/RELEASE-NOTES.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
